<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="bt bd" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="bt">PCA-GBT — gradient-boosted trees for the ThousandWorlds climate benchmark</title>
  <desc id="bd">A dark banner. On the left, the title PCA-GBT with a tagline and three climate-regime chips (snowball, temperate, runaway). On the right, a scatter of planets coloured cold-blue to hot-red rising through a sharp transition, with a white staircase showing how trees split exactly at the cliff.</desc>

  <rect x="0" y="0" width="1280" height="360" rx="20" fill="#0a1224"/>

  <!-- left: title block -->
  <text x="70" y="150" font-size="78" font-weight="700" fill="#ffffff" letter-spacing="-1">PCA-GBT</text>
  <text x="74" y="196" font-size="24" fill="#cdd6f4">Gradient-boosted trees for the ThousandWorlds climate benchmark.</text>
  <text x="74" y="226" font-size="16" fill="#7f8db0">Fast · CPU-only · built for the sharp transitions in planetary climate.</text>

  <!-- regime chips -->
  <g font-size="15" fill="#9fb6e6">
    <circle cx="80" cy="262" r="6" fill="#6fa8ff"/><text x="94" y="267">snowball</text>
    <circle cx="196" cy="262" r="6" fill="#f0b24a"/><text x="210" y="267">temperate</text>
    <circle cx="322" cy="262" r="6" fill="#e24b4a"/><text x="336" y="267">runaway</text>
  </g>

  <text x="74" y="312" font-size="15" fill="#69728f">Read on in plain English, or jump straight to the science — your lane is below.</text>

  <!-- right: regime-transition motif -->
  <g>
    <!-- faint baseline + flux arrow -->
    <line x1="800" y1="306" x2="1205" y2="306" stroke="#2a3550" stroke-width="1.5"/>
    <text x="1205" y="328" text-anchor="end" font-size="13" fill="#69728f">stellar flux →</text>
    <text x="800" y="64" font-size="13" fill="#69728f">surface temperature ↑</text>

    <!-- the staircase a tree learns: flat-low, step, step, flat-high -->
    <path d="M806,290 H928 V240 H1000 V176 H1100 V130 H1198" fill="none" stroke="#eaf0ff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.92"/>

    <!-- planets, coloured cold->hot -->
    <g>
      <circle cx="820" cy="292" r="5.5" fill="#6fa8ff"/><circle cx="846" cy="286" r="5.5" fill="#6fa8ff"/>
      <circle cx="864" cy="295" r="5.5" fill="#6fa8ff"/><circle cx="888" cy="281" r="5.5" fill="#6fa8ff"/>
      <circle cx="908" cy="289" r="5.5" fill="#6fa8ff"/><circle cx="926" cy="278" r="5.5" fill="#7fcfe6"/>
      <circle cx="948" cy="250" r="5.5" fill="#9fb6e6"/><circle cx="966" cy="224" r="5.5" fill="#cdd6f4"/>
      <circle cx="982" cy="200" r="5.5" fill="#f0b24a"/><circle cx="1002" cy="185" r="5.5" fill="#f0b24a"/>
      <circle cx="1018" cy="178" r="5.5" fill="#f0b24a"/><circle cx="1038" cy="170" r="5.5" fill="#f0b24a"/>
      <circle cx="1058" cy="182" r="5.5" fill="#f4a24a"/><circle cx="1078" cy="164" r="5.5" fill="#ef7a4a"/>
      <circle cx="1098" cy="156" r="5.5" fill="#e24b4a"/><circle cx="1118" cy="138" r="5.5" fill="#e24b4a"/>
      <circle cx="1138" cy="120" r="5.5" fill="#e24b4a"/><circle cx="1158" cy="131" r="5.5" fill="#e24b4a"/>
      <circle cx="1178" cy="108" r="5.5" fill="#e24b4a"/>
    </g>

    <text x="1000" y="92" text-anchor="middle" font-size="13" fill="#46d49a">trees split right at the cliff</text>
  </g>
</svg>
